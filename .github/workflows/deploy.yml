# Build the MyST site and deploy to GitHub Pages
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json
          cache: true
          cache_dependency_path: docs/pnpm-lock.yaml
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - name: Install site dependencies (mystmd, aggregation script)
        run: cd docs && pnpm install --frozen-lockfile
      - name: Aggregate reports into one page per project
        run: node docs/aggregate_reports.mjs
      - name: Build the site
        run: cd docs && pnpm exec myst build --html
        env:
          BASE_URL: /funding-proposals
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './docs/_build/html'
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
