# Build the MyST site and deploy to GitHub Pages
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install site dependencies (mystmd, aggregation script)
        run: cd docs && pnpm install --frozen-lockfile
      - name: Aggregate reports into one page per project
        run: node docs/aggregate_reports.mjs
      - name: Build the site
        run: cd docs && pnpm exec myst build --html
        env:
          BASE_URL: /funding-proposals
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/_build/html'
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
